<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="280" fill="#f5f0cb"/>
  <rect x="20" y="60" width="280" height="8" fill="#884E1B"/>
  <rect x="20" y="165" width="280" height="8" fill="#884E1B"/>
  <path d="M36,68 L36,78 Q36,82 40,82 L50,82" fill="none" stroke="#606C38" stroke-width="1.5"/>
  <path d="M284,68 L284,78 Q284,82 280,82 L270,82" fill="none" stroke="#606C38" stroke-width="1.5"/>
  <!-- Bunting -->
  <line x1="20" y1="20" x2="300" y2="20" stroke="#606C38" stroke-width="1"/>
  <polygon points="40,20 55,40 25,40" fill="#606C38" opacity="0.7"/>
  <polygon points="80,20 95,40 65,40" fill="#DDA15E" opacity="0.7"/>
  <polygon points="120,20 135,40 105,40" fill="#884E1B" opacity="0.7"/>
  <polygon points="160,20 175,40 145,40" fill="#606C38" opacity="0.7"/>
  <polygon points="200,20 215,40 185,40" fill="#DDA15E" opacity="0.7"/>
  <polygon points="240,20 255,40 225,40" fill="#884E1B" opacity="0.7"/>
  <polygon points="280,20 295,40 265,40" fill="#606C38" opacity="0.7"/>
  <!-- Sourdough boule -->
  <ellipse cx="70" cy="62" rx="35" ry="22" fill="#884E1B"/>
  <ellipse cx="70" cy="60" rx="33" ry="20" fill="#aa6633"/>
  <path d="M55,52 Q70,42 85,52" fill="none" stroke="#884E1B" stroke-width="1.5"/>
  <line x1="58" y1="58" x2="66" y2="54" stroke="#6b3e1e" stroke-width="1"/>
  <line x1="74" y1="54" x2="82" y2="58" stroke="#6b3e1e" stroke-width="1"/>
  <!-- Baguette -->
  <ellipse cx="180" cy="52" rx="60" ry="12" fill="#cc7a3a" transform="rotate(-8, 180, 52)"/>
  <ellipse cx="180" cy="50" rx="58" ry="10" fill="#d48840" transform="rotate(-8, 180, 50)"/>
  <line x1="148" y1="50" x2="154" y2="42" stroke="#aa5522" stroke-width="1" stroke-linecap="round" transform="rotate(-8, 180, 52)"/>
  <line x1="163" y1="47" x2="169" y2="39" stroke="#aa5522" stroke-width="1" stroke-linecap="round" transform="rotate(-8, 180, 52)"/>
  <line x1="178" y1="45" x2="184" y2="37" stroke="#aa5522" stroke-width="1" stroke-linecap="round" transform="rotate(-8, 180, 52)"/>
  <line x1="193" y1="47" x2="199" y2="39" stroke="#aa5522" stroke-width="1" stroke-linecap="round" transform="rotate(-8, 180, 52)"/>
  <!-- Rye loaf -->
  <rect x="256" y="42" width="42" height="26" rx="8" fill="#5a3a1e"/>
  <rect x="258" y="40" width="38" height="24" rx="7" fill="#6b4426"/>
  <!-- Top crust highlight -->
  <rect x="260" y="41" width="34" height="6" rx="4" fill="#7a5230" opacity="0.6"/>
  <!-- Score line down the centre length -->
  <path d="M263,41 Q277,37 291,41" fill="none" stroke="#3d2210" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <!-- Seeds -->
  <circle cx="266" cy="47" r="1.2" fill="#3d2210" opacity="0.8"/>
  <circle cx="273" cy="44" r="1.2" fill="#3d2210" opacity="0.8"/>
  <circle cx="280" cy="46" r="1.2" fill="#3d2210" opacity="0.8"/>
  <circle cx="287" cy="44" r="1.2" fill="#3d2210" opacity="0.8"/>
  <circle cx="270" cy="50" r="1" fill="#3d2210" opacity="0.6"/>
  <circle cx="283" cy="50" r="1" fill="#3d2210" opacity="0.6"/>
  <!-- Croissant -->
  <path d="M55,155 Q45,140 65,130 Q85,120 95,138 Q105,155 85,162 Q65,168 55,155Z" fill="#d49030"/>
  <path d="M58,153 Q50,140 67,132 Q82,124 90,140 Q98,152 82,158 Q66,163 58,153Z" fill="#e6a840"/>
  <!-- Layer lines to show lamination -->
  <path d="M60,151 Q68,138 80,130 Q88,126 93,136" fill="none" stroke="#c47820" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M62,156 Q70,143 82,135 Q90,131 95,141" fill="none" stroke="#c47820" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Tip darkening left -->
  <path d="M55,155 Q50,148 57,143 Q60,148 58,153Z" fill="#b86820" opacity="0.5"/>
  <!-- Tip darkening right -->
  <path d="M95,138 Q101,145 98,153 Q93,148 94,141Z" fill="#b86820" opacity="0.5"/>
  <!-- Tart -->
  <circle cx="165" cy="148" r="32" fill="#884E1B"/>
  <circle cx="165" cy="145" r="30" fill="#cc7a3a"/>
  <!-- Pastry rim -->
  <circle cx="165" cy="143" r="26" fill="none" stroke="#aa5522" stroke-width="3"/>
  <circle cx="165" cy="143" r="26" fill="#FEFAE0"/>
  <circle cx="165" cy="143" r="22" fill="#DDA15E" opacity="0.6"/>
  <!-- Lattice cross lines -->
  <line x1="145" y1="133" x2="185" y2="153" stroke="#884E1B" stroke-width="1.2" opacity="0.6"/>
  <line x1="185" y1="133" x2="145" y2="153" stroke="#884E1B" stroke-width="1.2" opacity="0.6"/>
  <!-- Extra lattice lines for more definition -->
  <line x1="155" y1="128" x2="175" y2="158" stroke="#884E1B" stroke-width="1" opacity="0.4"/>
  <line x1="175" y1="128" x2="155" y2="158" stroke="#884E1B" stroke-width="1" opacity="0.4"/>
  <!-- Fruit dots in each section -->
  <circle cx="165" cy="136" r="2.5" fill="#884E1B" opacity="0.6"/>
  <circle cx="158" cy="146" r="2.5" fill="#884E1B" opacity="0.6"/>
  <circle cx="172" cy="146" r="2.5" fill="#884E1B" opacity="0.6"/>
  <circle cx="165" cy="154" r="2.5" fill="#884E1B" opacity="0.6"/>
  <!-- Rolls: clipPaths to hide score lines behind top roll -->
  <defs>
    <clipPath id="clip-left-roll">
      <circle cx="262" cy="155" r="16"/>
    </clipPath>
    <clipPath id="clip-right-roll">
      <circle cx="280" cy="158" r="14"/>
    </clipPath>
  </defs>
  <!-- Bottom left roll -->
  <circle cx="262" cy="155" r="16" fill="#cc7a3a"/>
  <!-- Bottom left roll score lines, masked by top roll shape -->
  <g clip-path="url(#clip-left-roll)">
    <path d="M254,148 Q262,141 270,148" fill="none" stroke="#aa5522" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <path d="M258,155 Q262,150 266,155" fill="none" stroke="#aa5522" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <!-- Cover the part behind the top roll -->
    <circle cx="268" cy="145" r="12" fill="#cc7a3a"/>
  </g>
  <ellipse cx="258" cy="150" rx="4" ry="2.5" fill="#e09050" opacity="0.4"/>
  <!-- Bottom right roll -->
  <circle cx="280" cy="158" r="14" fill="#d48840"/>
  <!-- Bottom right roll score lines, masked by top roll shape -->
  <g clip-path="url(#clip-right-roll)">
    <path d="M273,151 Q280,145 287,151" fill="none" stroke="#aa5522" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <path d="M275,158 Q280,153 285,158" fill="none" stroke="#aa5522" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <!-- Cover the part behind the top roll -->
    <circle cx="268" cy="145" r="12" fill="#d48840"/>
  </g>
  <ellipse cx="276" cy="152" rx="3.5" ry="2" fill="#e09050" opacity="0.4"/>
  <!-- Top roll, drawn last so it sits on top -->
  <circle cx="268" cy="145" r="12" fill="#bb6830"/>
  <path d="M262,139 Q268,134 274,139" fill="none" stroke="#884E1B" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <ellipse cx="264" cy="141" rx="3" ry="2" fill="#cc7040" opacity="0.4"/>
  <text x="160" y="215" text-anchor="middle" font-family="Lora, serif" font-style="italic" font-size="13" fill="#884E1B" opacity="0.8">Baked this morning</text>
  <line x1="60" y1="220" x2="130" y2="220" stroke="#DDA15E" stroke-width="0.8" opacity="0.6"/>
  <line x1="190" y1="220" x2="260" y2="220" stroke="#DDA15E" stroke-width="0.8" opacity="0.6"/>
  <rect x="0" y="260" width="320" height="20" fill="#606C38" opacity="0.12"/>
  <rect x="0" y="260" width="320" height="2" fill="#DDA15E" opacity="0.4"/>
</svg>
