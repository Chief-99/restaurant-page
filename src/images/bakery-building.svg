<svg viewBox="0 0 420 380" xmlns="http://www.w3.org/2000/svg">

  <!-- Building body -->
  <rect x="60" y="110" width="300" height="250" fill="#1e2e0d"/>
  <rect x="60" y="110" width="300" height="250" fill="none" stroke="#606C38" stroke-width="1.5" opacity="0.6"/>

  <!-- Facade horizontal lines -->
  <line x1="60" y1="150" x2="360" y2="150" stroke="#283618" stroke-width="1"/>
  <line x1="60" y1="190" x2="360" y2="190" stroke="#283618" stroke-width="1"/>
  <line x1="60" y1="230" x2="360" y2="230" stroke="#283618" stroke-width="1"/>
  <line x1="60" y1="270" x2="360" y2="270" stroke="#283618" stroke-width="1"/>

  <!-- Roof pediment -->
  <polygon points="60,110 210,50 360,110" fill="#283618" stroke="#606C38" stroke-width="1.5"/>
  <line x1="60" y1="110" x2="210" y2="50" stroke="#DDA15E" stroke-width="0.8" opacity="0.6"/>
  <line x1="210" y1="50" x2="360" y2="110" stroke="#DDA15E" stroke-width="0.8" opacity="0.6"/>

  <!-- Finial -->
  <circle cx="210" cy="46" r="5" fill="#DDA15E"/>
  <line x1="210" y1="41" x2="210" y2="28" stroke="#DDA15E" stroke-width="1.5"/>
  <circle cx="210" cy="24" r="3" fill="#DDA15E"/>

  <!-- Smoke puffs -->
  <circle cx="289" cy="24" r="6" fill="none" stroke="#9a8c6e" stroke-width="0.8" opacity="0.5"/>
  <circle cx="294" cy="14" r="7" fill="none" stroke="#9a8c6e" stroke-width="0.8" opacity="0.35"/>
  <circle cx="287" cy="5" r="8" fill="none" stroke="#9a8c6e" stroke-width="0.6" opacity="0.2"/>

  <!-- Cornice -->
  <rect x="52" y="105" width="316" height="12" fill="#606C38"/>
  <rect x="55" y="114" width="310" height="4" fill="#DDA15E" opacity="0.5"/>

  <!-- Shop window -->
  <rect x="100" y="200" width="220" height="120" fill="#3a2800" opacity="0.9"/>
  <rect x="100" y="200" width="220" height="120" fill="#DDA15E" opacity="0.12"/>
  <rect x="108" y="208" width="204" height="104" fill="#884E1B" opacity="0.25"/>
  <line x1="210" y1="200" x2="210" y2="320" stroke="#606C38" stroke-width="2.5"/>
  <line x1="100" y1="260" x2="320" y2="260" stroke="#606C38" stroke-width="2.5"/>
  <rect x="100" y="200" width="220" height="120" fill="none" stroke="#DDA15E" stroke-width="2"/>

  <!-- Bakery sign -->
  <rect x="120" y="168" width="180" height="28" fill="#606C38"/>
  <text x="210" y="187" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#FEFAE0" letter-spacing="1">Busi's Bakery</text>

  <!-- Door -->
  <rect x="175" y="280" width="70" height="80" fill="#3a2800"/>
  <rect x="175" y="280" width="70" height="80" fill="none" stroke="#DDA15E" stroke-width="1.5"/>
  <path d="M175,280 Q210,258 245,280" fill="#3a2800" stroke="#DDA15E" stroke-width="1.5"/>
  <circle cx="238" cy="322" r="3" fill="#DDA15E"/>
  <rect x="183" y="290" width="22" height="28" fill="none" stroke="#606C38" stroke-width="0.8"/>
  <rect x="215" y="290" width="22" height="28" fill="none" stroke="#606C38" stroke-width="0.8"/>

  <!-- Pilasters -->
  <rect x="60" y="110" width="18" height="250" fill="#283618" opacity="0.7"/>
  <rect x="342" y="110" width="18" height="250" fill="#283618" opacity="0.7"/>

  <!-- Ground / pavement -->
  <rect x="0" y="355" width="420" height="25" fill="#1e2e0d"/>
  <rect x="0" y="352" width="420" height="5" fill="#606C38" opacity="0.6"/>

  <!-- Bicycle: back wheel -->
  <circle cx="95" cy="332" r="28" fill="none" stroke="#DDA15E" stroke-width="2"/>
  <circle cx="95" cy="332" r="4" fill="#DDA15E"/>
  <line x1="95" y1="304" x2="95" y2="360" stroke="#DDA15E" stroke-width="0.8" opacity="0.6"/>
  <line x1="67" y1="332" x2="123" y2="332" stroke="#DDA15E" stroke-width="0.8" opacity="0.6"/>
  <line x1="75" y1="312" x2="115" y2="352" stroke="#DDA15E" stroke-width="0.8" opacity="0.4"/>
  <line x1="75" y1="352" x2="115" y2="312" stroke="#DDA15E" stroke-width="0.8" opacity="0.4"/>

  <!-- Bicycle: front wheel -->
  <circle cx="155" cy="332" r="28" fill="none" stroke="#DDA15E" stroke-width="2"/>
  <circle cx="155" cy="332" r="4" fill="#DDA15E"/>
  <line x1="155" y1="304" x2="155" y2="360" stroke="#DDA15E" stroke-width="0.8" opacity="0.6"/>
  <line x1="127" y1="332" x2="183" y2="332" stroke="#DDA15E" stroke-width="0.8" opacity="0.6"/>
  <line x1="135" y1="312" x2="175" y2="352" stroke="#DDA15E" stroke-width="0.8" opacity="0.4"/>
  <line x1="135" y1="352" x2="175" y2="312" stroke="#DDA15E" stroke-width="0.8" opacity="0.4"/>

  <!-- Bicycle: frame -->
  <line x1="95" y1="332" x2="125" y2="310" stroke="#884E1B" stroke-width="2.5"/>
  <line x1="95" y1="332" x2="128" y2="295" stroke="#884E1B" stroke-width="1.5"/>
  <line x1="128" y1="295" x2="158" y2="295" stroke="#884E1B" stroke-width="2.5"/>
  <line x1="158" y1="295" x2="125" y2="310" stroke="#884E1B" stroke-width="2.5"/>
  <line x1="158" y1="295" x2="155" y2="304" stroke="#884E1B" stroke-width="2"/>

  <!-- Bicycle: seat post + saddle -->
  <line x1="128" y1="295" x2="126" y2="278" stroke="#884E1B" stroke-width="2"/>
  <ellipse cx="123" cy="276" rx="16" ry="5" fill="#606C38"/>

  <!-- Bicycle: handlebar stem + bars + grips -->
  <line x1="158" y1="295" x2="162" y2="278" stroke="#884E1B" stroke-width="2"/>
  <line x1="152" y1="276" x2="172" y2="276" stroke="#884E1B" stroke-width="2.5"/>
  <circle cx="152" cy="276" r="3" fill="#606C38"/>
  <circle cx="172" cy="276" r="3" fill="#606C38"/>

  <!-- Bicycle: front basket -->
  <rect x="155" y="296" width="24" height="16" fill="none" stroke="#DDA15E" stroke-width="1.2" rx="2"/>
  <line x1="162" y1="296" x2="162" y2="312" stroke="#DDA15E" stroke-width="0.7" opacity="0.7"/>
  <line x1="170" y1="296" x2="170" y2="312" stroke="#DDA15E" stroke-width="0.7" opacity="0.7"/>

  <!-- Bread loaf in basket -->
  <ellipse cx="167" cy="296" rx="9" ry="4" fill="#884E1B" opacity="0.8"/>

</svg>
